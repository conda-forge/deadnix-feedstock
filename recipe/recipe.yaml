context:
  version: "1.3.2"

package:
  name: deadnix
  version: ${{ version }}

source:
  url: https://github.com/astro/deadnix/archive/v${{ version }}.tar.gz
  sha256: 9706c5e49a36233e0131ed5e1584d4f532aa0d2b27ac4a3ae4187634f3487898

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - deadnix --help

about:
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Scan Nix files for dead code
  homepage: https://github.com/astro/deadnix
  repository: https://github.com/astro/deadnix

extra:
  recipe-maintainers:
    - danielnachun
